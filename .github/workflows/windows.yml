name: Windows

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc -DIPMX_WARNINGS_AS_ERRORS=ON -DIPMX_ENABLE_CLANG_TIDY=ON

      - name: Verify formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem apps,src,tests -Recurse -File -Include *.cpp,*.hpp
          clang-format --dry-run --Werror $files.FullName

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc

      - name: Test
        shell: pwsh
        run: ctest --preset windows-msvc
